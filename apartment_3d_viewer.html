
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartment E.1.5.47 - 3D Viewer</title>
    <!-- Simple favicon to avoid 404 errors -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #1a1a2e;
            color: white;
        }

        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            min-width: 280px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #4fc3f7;
        }

        .subtitle {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 20px;
        }

        .info-item {
            margin-bottom: 12px;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            border-left: 3px solid #4fc3f7;
        }

        .info-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 16px;
            font-weight: 600;
            color: white;
            margin-top: 2px;
        }

        .button-group {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
            text-align: center;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        #viewControls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .control-hint {
            font-size: 13px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-icon {
            font-size: 18px;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px 50px;
            border-radius: 12px;
            z-index: 1000;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #4fc3f7;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .toggle-switch {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 12px 0;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
        }

        .toggle-label {
            font-size: 13px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #444;
            transition: .4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>

        <div id="loading">
            <div class="spinner"></div>
            <div>Loading 3D Model...</div>
        </div>

        <div id="controls">
            <h1>🏢 Apartment E.1.5.47</h1>
            <div class="subtitle">3D Interactive Viewer</div>

            <div class="info-item">
                <div class="info-label">Total Area</div>
                <div class="info-value">73.97 m²</div>
            </div>

            <div class="info-item">
                <div class="info-label">Ceiling Height</div>
                <div class="info-value">2.60 m</div>
            </div>

            <div class="info-item">
                <div class="info-label">Floor</div>
                <div class="info-value">5th Floor</div>
            </div>

            <div class="info-item">
                <div class="info-label">Rooms</div>
                <div class="info-value">8 + Balcony</div>
            </div>

            <div class="toggle-switch">
                <span class="toggle-label">Grid</span>
                <label class="switch">
                    <input type="checkbox" id="toggleGrid" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="toggle-switch">
                <span class="toggle-label">Wireframe</span>
                <label class="switch">
                    <input type="checkbox" id="toggleWireframe">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="toggle-switch">
                <span class="toggle-label">Auto Rotate</span>
                <label class="switch">
                    <input type="checkbox" id="toggleRotate">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="button-group">
                <button onclick="setView('top')">Top View</button>
                <button onclick="setView('front')">Front View</button>
                <button onclick="setView('side')">Side View</button>
                <button onclick="setView('iso')">3D View</button>
            </div>
        </div>

        <div id="viewControls">
            <div class="control-hint">
                <span class="control-icon">🖱️</span>
                <span>Left Click + Drag to Rotate</span>
            </div>
            <div class="control-hint">
                <span class="control-icon">🔍</span>
                <span>Scroll to Zoom</span>
            </div>
            <div class="control-hint">
                <span class="control-icon">👆</span>
                <span>Right Click + Drag to Pan</span>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // Scene setup
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 20, 50);

        // Camera
        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(12, 10, 12);

        // Renderer
        const renderer = new THREE.WebGLRenderer({
            canvas,
            antialias: true,
            alpha: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // Controls
        const controls = new OrbitControls(camera, canvas);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 3;
        controls.maxDistance = 50;
        controls.maxPolarAngle = Math.PI / 2;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight1.position.set(10, 15, 10);
        directionalLight1.castShadow = true;
        directionalLight1.shadow.mapSize.width = 2048;
        directionalLight1.shadow.mapSize.height = 2048;
        scene.add(directionalLight1);

        const directionalLight2 = new THREE.DirectionalLight(0x4fc3f7, 0.3);
        directionalLight2.position.set(-10, 10, -10);
        scene.add(directionalLight2);

        const hemisphereLight = new THREE.HemisphereLight(0x87CEEB, 0x808080, 0.4);
        scene.add(hemisphereLight);

        // Grid
        const gridHelper = new THREE.GridHelper(30, 30, 0x4fc3f7, 0x333344);
        gridHelper.material.opacity = 0.3;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        // Axes helper (subtle)
        const axesHelper = new THREE.AxesHelper(5);
        axesHelper.material.opacity = 0.5;
        axesHelper.material.transparent = true;
        scene.add(axesHelper);

        // Embedded glTF model data (to avoid CORS issues when opening directly)
        const gltfData = {
            "asset": {
                "version": "2.0",
                "generator": "Python glTF Generator",
                "copyright": "Apartment E.1.5.47"
            },
            "scene": 0,
            "scenes": [{"name": "Apartment E.1.5.47", "nodes": [0]}],
            "nodes": [{"name": "Apartment", "mesh": 0}],
            "meshes": [{
                "name": "Apartment Geometry",
                "primitives": [{
                    "attributes": {"POSITION": 0},
                    "indices": 1,
                    "material": 0
                }]
            }],
            "materials": [{
                "name": "Apartment Material",
                "pbrMetallicRoughness": {
                    "baseColorFactor": [0.9, 0.9, 0.9, 1.0],
                    "metallicFactor": 0.0,
                    "roughnessFactor": 0.8
                }
            }],
            "accessors": [
                {
                    "bufferView": 0,
                    "byteOffset": 0,
                    "componentType": 5126,
                    "count": 48,
                    "type": "VEC3",
                    "min": [-0.125, -0.2, -0.125],
                    "max": [6.625, 2.8000000000000003, 14.125]
                },
                {
                    "bufferView": 1,
                    "byteOffset": 0,
                    "componentType": 5123,
                    "count": 216,
                    "type": "SCALAR"
                }
            ],
            "bufferViews": [
                {
                    "buffer": 0,
                    "byteOffset": 0,
                    "byteLength": 576,
                    "target": 34962
                },
                {
                    "buffer": 0,
                    "byteOffset": 576,
                    "byteLength": 432,
                    "target": 34963
                }
            ],
            "buffers": [{
                "byteLength": 1008,
                "uri": "data:application/octet-stream;base64,AAAAAM3MTL4AAAAAAADQQM3MTL4AAAAAAADQQM3MTL4AAGBBAAAAAM3MTL4AAGBBAAAAAAAAAAAAAAAAAADQQAAAAAAAAAAAAADQQAAAAAAAAGBBAAAAAAAAAAAAAGBBAAAAAAAAAAAAAAC+AADQQAAAAAAAAAC+AADQQAAAAAAAAAA+AAAAAAAAAAAAAAA+AAAAAGZmJkAAAAC+AADQQGZmJkAAAAC+AADQQGZmJkAAAAA+AAAAAGZmJkAAAAA+AADMQAAAAAAAAAAAAADUQAAAAAAAAAAAAADUQAAAAAAAAGBBAADMQAAAAAAAAGBBAADMQGZmJkAAAAAAAADUQGZmJkAAAAAAAADUQGZmJkAAAGBBAADMQGZmJkAAAGBBAAAAAAAAAAAAAF5BAADQQAAAAAAAAF5BAADQQAAAAAAAAGJBAAAAAAAAAAAAAGJBAAAAAGZmJkAAAF5BAADQQGZmJkAAAF5BAADQQGZmJkAAAGJBAAAAAGZmJkAAAGJBAAAAvgAAAAAAAAAAAAAAPgAAAAAAAAAAAAAAPgAAAAAAAGBBAAAAvgAAAAAAAGBBAAAAvmZmJkAAAAAAAAAAPmZmJkAAAAAAAAAAPmZmJkAAAGBBAAAAvmZmJkAAAGBBAAAAAGZmJkAAAAAAAADQQGZmJkAAAAAAAADQQGZmJkAAAGBBAAAAAGZmJkAAAGBBAAAAADMzM0AAAAAAAADQQDMzM0AAAAAAAADQQDMzM0AAAGBBAAAAADMzM0AAAGBBAAABAAIAAAACAAMABAAGAAUABAAHAAYAAAAFAAEAAAAEAAUAAgAHAAMAAgAGAAcAAAAHAAQAAAADAAcAAQAGAAIAAQAFAAYACAAJAAoACAAKAAsADAAOAA0ADAAPAA4ACAANAAkACAAMAA0ACgAPAAsACgAOAA8ACAAPAAwACAALAA8ACQAOAAoACQANAA4AEAARABIAEAASABMAFAAWABUAFAAXABYAEAAVABEAEAAUABUAEgAXABMAEgAWABcAEAAXABQAEAATABcAEQAWABIAEQAVABYAGAAZABoAGAAaABsAHAAeAB0AHAAfAB4AGAAdABkAGAAcAB0AGgAfABsAGgAeAB8AGAAfABwAGAAbAB8AGQAeABoAGQAdAB4AIAAhACIAIAAiACMAJAAmACUAJAAnACYAIAAlACEAIAAkACUAIgAnACMAIgAmACcAIAAnACQAIAAjACcAIQAmACIAIQAlACYAKAApACoAKAAqACsALAAuAC0ALAAvAC4AKAAtACkAKAAsAC0AKgAvACsAKgAuAC8AKAAvACwAKAArAC8AKQAuACoAKQAtAC4A"
            }]
        };

        // Load glTF model
        let apartmentModel;
        let autoRotate = false;
        const loader = new GLTFLoader();

        // Parse embedded glTF data
        loader.parse(
            JSON.stringify(gltfData),
            '',
            (gltf) => {
                apartmentModel = gltf.scene;

                // Add shadows
                apartmentModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;

                        // Enhance materials
                        if (child.material) {
                            child.material.metalness = 0.1;
                            child.material.roughness = 0.7;
                            child.material.envMapIntensity = 1;
                        }
                    }
                });

                // Center and add to scene
                const box = new THREE.Box3().setFromObject(apartmentModel);
                const center = box.getCenter(new THREE.Vector3());
                apartmentModel.position.sub(center);

                scene.add(apartmentModel);

                // Hide loading
                document.getElementById('loading').style.display = 'none';

                console.log('Model loaded successfully');
            },
            (error) => {
                console.error('Error loading model:', error);
                document.getElementById('loading').innerHTML =
                    '<div style="color: #ff6b6b;">Error loading model. Please check console.</div>';
            }
        );

        // View presets
        window.setView = (view) => {
            const distance = 15;
            let newPos;

            switch(view) {
                case 'top':
                    newPos = new THREE.Vector3(0, distance, 0);
                    break;
                case 'front':
                    newPos = new THREE.Vector3(0, 5, distance);
                    break;
                case 'side':
                    newPos = new THREE.Vector3(distance, 5, 0);
                    break;
                case 'iso':
                default:
                    newPos = new THREE.Vector3(12, 10, 12);
            }

            // Smooth camera transition
            const startPos = camera.position.clone();
            const startTime = Date.now();
            const duration = 1000;

            function animateCamera() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3); // ease out cubic

                camera.position.lerpVectors(startPos, newPos, eased);

                if (progress < 1) {
                    requestAnimationFrame(animateCamera);
                }
            }
            animateCamera();
        };

        // Toggle controls
        document.getElementById('toggleGrid').addEventListener('change', (e) => {
            gridHelper.visible = e.target.checked;
            axesHelper.visible = e.target.checked;
        });

        document.getElementById('toggleWireframe').addEventListener('change', (e) => {
            if (apartmentModel) {
                apartmentModel.traverse((child) => {
                    if (child.isMesh) {
                        child.material.wireframe = e.target.checked;
                    }
                });
            }
        });

        document.getElementById('toggleRotate').addEventListener('change', (e) => {
            autoRotate = e.target.checked;
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            // Auto rotate
            if (autoRotate && apartmentModel) {
                apartmentModel.rotation.y += 0.003;
            }

            // Animate particles
            particles.rotation.y += 0.0002;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
